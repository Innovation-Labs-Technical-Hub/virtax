[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.89"
repository = "https://github.com/innovation-labs/oxbox"

[workspace.dependencies]
oxbox-model = { path = "crates/oxbox-model" }
oxbox-store = { path = "crates/oxbox-store" }
oxbox-engine = { path = "crates/oxbox-engine" }
oxbox-api = { path = "crates/oxbox-api" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
futures = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
rusqlite = { version = "0.43", features = ["bundled"] }
rustix = { version = "1", features = ["process"] }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = "0.7"
toml = { version = "1", features = ["preserve_order"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
