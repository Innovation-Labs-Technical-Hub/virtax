name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows joins once the named-pipe transport lands (the daemon is Unix-socket only today).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci

  kvm:
    name: kvm boot tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Allow this user to use /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get install --yes busybox-static
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask guest-kernel
      - run: cargo xtask kvm-test
