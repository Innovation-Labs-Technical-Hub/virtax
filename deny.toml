# cargo-deny policy (FR-CP12-011, NFR-00-13). Run with `cargo xtask deny`.
# Every exception below needs a comment saying why and when it can be removed.

[graph]
# The hosts CI builds for; Windows joins with the named-pipe transport (plan phase 12).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# RustSec advisories fail the check; unmaintained and yanked crates are reported too.
yanked = "deny"
ignore = []

[licenses]
# Licences compatible with GPL-3.0-or-later. Anything else (SSPL, BUSL, proprietary, GPL-2.0-only) fails CI.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
# Version wildcards are refused for registry crates; workspace path dependencies are fine.
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
# crates.io only; a git dependency needs an explicit entry here with a pinned rev.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
